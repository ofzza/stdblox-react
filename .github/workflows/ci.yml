name: CI

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]

permissions:
  contents: read

# Supersede superseded pull request runs, but never cancel a run on master
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            react-versions/*/package-lock.json

      # Plain `npm ci`: `--ignore-scripts` would skip install hooks that `unrs-resolver` and
      # `@parcel/watcher` rely on to link their native bindings, and `prepare`, which installs the
      # test environment of every additional React version
      - run: npm ci

      # Build, showcase type check and build, ESLint, Prettier and tests (under every supported
      # React version), run sequentially by `npm-run-all ci:*`
      - run: npm run ci

  react-versions:
    name: React versions
    runs-on: ubuntu-latest
    outputs:
      majors: ${{ steps.list.outputs.majors }}
    steps:
      - uses: actions/checkout@v7

      # The supported React majors, as a JSON array, discovered the same way the Vitest config does
      - id: list
        run: echo "majors=$(node scripts/react-versions.mjs list)" >> "$GITHUB_OUTPUT"

  react:
    name: React ${{ matrix.react }} consumer
    needs: react-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ${{ fromJSON(needs.react-versions.outputs.majors) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            react-versions/*/package-lock.json

      - run: npm ci

      # Packs the library, installs it into a throwaway consumer with a real install of this React
      # version, then type checks and runs a smoke test against it
      - run: npm run smoke -- ${{ matrix.react }}
